services:
  - type: web
    name: secure-ai-docs-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://secure-ai-docs.onrender.com/api
      - key: VITE_API_BASE_URL
        value: https://secure-ai-docs.onrender.com/api/v1
      - key: VITE_ENABLE_MOCK_DEMO
        value: "true"
